{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeurAi - Acesso Administrativo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen overflow-hidden bg-[#eaf6fd]">


    <!-- ONDAS -->
    <img
        src="{% static 'images/ondas.png' %}"
        alt=""
        class="absolute bottom-0 left-0 z-0 h-auto w-full"
    >


    <!-- LOGO -->
    <img
        src="{% static 'images/logo.png' %}"
        alt="Logo NeurAi"
        class="absolute left-1/2 top-8 z-10 w-40 -translate-x-1/2 object-contain
               md:left-[12%] md:top-[45%] md:w-60 md:translate-x-0 md:-translate-y-1/2"
    >


    <!-- FORMULÁRIO -->
    <main
        class="relative z-20 flex min-h-screen items-center justify-center
               px-4 pt-28
               md:justify-end md:px-10 md:pt-0"
    >

        <!-- CARD -->
        <div
    class="w-full max-w-[581px] rounded-[20px] bg-white px-7 py-6
           shadow-[0_8px_18px_rgba(0,0,0,0.25)]
           md:mr-[5%]"
>

    <!-- TÍTULO -->
    <div class="text-center">

        <h2 class="text-xl font-bold text-gray-900">
            Cadastro de Administrador
        </h2>

        <p class="mt-2 text-xs text-gray-700">
            Preencha os dados para criar um novo acesso administrativo
        </p>

    </div>


    <!-- FORMULÁRIO -->
    <form class="mt-6" method="post" action="{% url 'cadastro_admin' %}">
        {% csrf_token %}

        {% if erro %}
            <p class="mb-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
                {{ erro }}
            </p>
        {% endif %}


        <!-- NOME COMPLETO -->
        <div>

            <label
                for="nome"
                class="mb-2 block text-sm font-semibold text-gray-600"
            >
                Nome completo
            </label>

            <div class="relative">

                <!-- ÍCONE USUÁRIO -->
                <svg
                    class="absolute left-5 top-1/2 h-[22px] w-[22px] -translate-y-1/2"
                    width="25"
                    height="25"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <circle
                        cx="12"
                        cy="7"
                        r="4"
                        stroke="#AAB4BC"
                        stroke-width="1.8"
                    />
                    <path
                        d="M4 21C4.6 16.8 7.3 14.5 12 14.5C16.7 14.5 19.4 16.8 20 21"
                        stroke="#AAB4BC"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />
                </svg>

                <!-- INPUT NOME -->
                <input
                    id="nome"
                    name="nome"
                    type="text"
                    placeholder="Digite o nome completo"
                    autocomplete="name"
                    required
                    class="h-11 w-full rounded-xl border border-[#9ee4f2]
                           bg-white pl-16 pr-5 text-sm text-gray-700
                           outline-none transition
                           focus:border-[#54bced]
                           focus:ring-2 focus:ring-[#54bced]/20"
                >

            </div>

        </div>


        <!-- E-MAIL + CÓDIGO DE ADMINISTRADOR -->
        <div class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2">

            <!-- E-MAIL -->
            <div>

                <label
                    for="email"
                    class="mb-2 block text-sm font-semibold text-gray-600"
                >
                    E-mail
                </label>

                <div class="relative">

                    <!-- ÍCONE CARTA -->
                    <svg
                        class="absolute left-5 top-1/2 h-[22px] w-[22px] -translate-y-1/2"
                        width="25"
                        height="25"
                        viewBox="0 0 28 27"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M22.1667 1.12482H5.83332C4.28679 1.1266 2.80414 1.71981 1.71057 2.77431C0.617014 3.82882 0.00183724 5.25852 -1.52588e-05 6.74982V20.2498C0.00183724 21.7411 0.617014 23.1708 1.71057 24.2253C2.80414 25.2798 4.28679 25.873 5.83332 25.8748H22.1667C23.7132 25.873 25.1958 25.2798 26.2894 24.2253C27.383 23.1708 27.9981 21.7411 28 20.2498V6.74982C27.9981 5.25852 27.383 3.82882 26.2894 2.77431C25.1958 1.71981 23.7132 1.1266 22.1667 1.12482ZM5.83332 3.37482H22.1667C22.8652 3.37614 23.5474 3.57902 24.1254 3.95735C24.7034 4.33567 25.1508 4.87213 25.41 5.49769L16.4757 14.1141C15.8182 14.7455 14.928 15.1001 14 15.1001C13.072 15.1001 12.1818 14.7455 11.5243 14.1141L2.58998 5.49769C2.84916 4.87213 3.29653 4.33567 3.87454 3.95735C4.45255 3.57902 5.13474 3.37614 5.83332 3.37482ZM22.1667 23.6248H5.83332C4.90506 23.6248 4.01482 23.2692 3.35844 22.6363C2.70207 22.0034 2.33332 21.1449 2.33332 20.2498V8.43732L9.87465 15.7048C10.9697 16.7581 12.4533 17.3496 14 17.3496C15.5467 17.3496 17.0303 16.7581 18.1253 15.7048L25.6667 8.43732V20.2498C25.6667 21.1449 25.2979 22.0034 24.6415 22.6363C23.9851 23.2694 23.0949 23.6248 22.1667 23.6248Z"
                            fill="#BBBBBB"
                        />
                    </svg>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                        class="h-11 w-full rounded-xl border border-[#9ee4f2]
                               bg-white pl-16 pr-5 text-sm text-gray-700
                               outline-none transition
                               focus:border-[#54bced]
                               focus:ring-2 focus:ring-[#54bced]/20"
                    >

                </div>

            </div>


            <!-- CÓDIGO DE ADMINISTRADOR -->
            <div>

                <label
                    for="codigo_admin"
                    class="mb-2 block text-sm font-semibold text-gray-600"
                >
                    Código de Administrador
                </label>

                <div class="relative">

                    <!-- ÍCONE CHAVE -->
                    <svg
                        class="absolute left-5 top-1/2 h-[22px] w-[22px] -translate-y-1/2"
                        width="25"
                        height="25"
                        viewBox="0 0 28 27"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="7"
                            cy="13.5"
                            r="4.5"
                            fill="#BBBBBB"
                        />
                        <rect
                            x="10"
                            y="11.5"
                            width="14"
                            height="4"
                            rx="2"
                            fill="#BBBBBB"
                        />
                        <rect
                            x="19"
                            y="14"
                            width="3"
                            height="4"
                            fill="#BBBBBB"
                        />
                        <rect
                            x="22"
                            y="14"
                            width="3"
                            height="3"
                            fill="#BBBBBB"
                        />
                    </svg>

                    <input
                        id="codigo_admin"
                        name="codigo_admin"
                        type="text"
                        placeholder="Digite o código de acesso"
                        required
                        class="h-11 w-full rounded-xl border border-[#9ee4f2]
                               bg-white pl-16 pr-5 text-sm text-gray-700
                               outline-none transition
                               focus:border-[#54bced]
                               focus:ring-2 focus:ring-[#54bced]/20"
                    >

                </div>

            </div>

        </div>


        <!-- SENHA + CONFIRMAR SENHA -->
        <div class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2">

            <!-- SENHA -->
            <div>

                <label
                    for="senha"
                    class="mb-2 block text-sm font-semibold text-gray-600"
                >
                    Senha
                </label>

                <div class="relative">

                    <!-- ÍCONE CADEADO -->
                    <svg
                        class="absolute left-5 top-1/2 h-[22px] w-[22px] -translate-y-1/2"
                        width="25"
                        height="25"
                        viewBox="0 0 28 27"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M22.1666 9.477V7.875C22.1666 5.78642 21.3062 3.78338 19.7746 2.30653C18.2431 0.829685 16.1658 0 13.9999 0C11.834 0 9.75675 0.829685 8.2252 2.30653C6.69365 3.78338 5.83324 5.78642 5.83324 7.875V9.477C4.79416 9.91429 3.90975 10.6341 3.28815 11.5484C2.66656 12.4626 2.33473 13.5318 2.33324 14.625V21.375C2.33509 22.8663 2.95027 24.296 4.04383 25.3505C5.13739 26.405 6.62004 26.9982 8.16657 27H19.8332C21.3798 26.9982 22.8624 26.405 23.956 25.3505C25.0495 24.296 25.6647 22.8663 25.6666 21.375V14.625C25.6651 13.5318 25.3333 12.4626 24.7117 11.5484C24.0901 10.6341 23.2057 9.91429 22.1666 9.477ZM8.16657 7.875C8.16657 6.38316 8.78115 4.95242 9.87511 3.89752C10.9691 2.84263 12.4528 2.25 13.9999 2.25C15.547 2.25 17.0307 2.84263 18.1247 3.89752C19.2187 4.95242 19.8332 7.875 19.8332 7.875V9H8.16657V7.875ZM23.3332 21.375C23.3332 22.2701 22.9645 23.1286 22.3081 23.7615C21.6517 24.3944 20.7615 24.75 19.8332 24.75H8.16657C7.23831 24.75 6.34807 24.3944 5.6917 23.7615C5.03532 23.1286 4.66657 22.2701 4.66657 21.375V14.625C4.66657 13.7299 5.03532 12.8714 5.6917 12.2385C6.34807 11.6056 7.23831 11.25 8.16657 11.25H19.8332C20.7615 11.25 21.6517 11.6056 23.3332 21.375Z"
                            fill="#BBBBBB"
                        />
                        <path
                            d="M13.9999 15.7496C13.6905 15.7496 13.3938 15.8682 13.175 16.0791C12.9562 16.2901 12.8333 16.5763 12.8333 16.8746V19.1246C12.8333 19.423 12.9562 19.7091 13.175 19.9201C13.3938 20.1311 13.6905 20.2496 13.9999 20.2496C14.3093 20.2496 14.6061 20.1311 14.8249 19.9201C15.0437 19.7091 15.1666 19.423 15.1666 19.1246V16.8746C15.1666 16.5763 15.0437 16.2901 14.8249 16.0791C14.6061 15.8682 14.3093 15.7496 13.9999 15.7496Z"
                            fill="#BBBBBB"
                        />
                    </svg>

                    <input
                        id="senha"
                        name="senha"
                        type="password"
                        placeholder="••••••••••"
                        autocomplete="new-password"
                        required
                        minlength="8"
                        class="h-11 w-full rounded-xl border border-[#9ee4f2]
                               bg-white pl-16 pr-5 text-sm text-gray-700
                               outline-none transition
                               focus:border-[#54bced]
                               focus:ring-2 focus:ring-[#54bced]/20"
                    >

                </div>

            </div>


            <!-- CONFIRMAR SENHA -->
            <div>

                <label
                    for="confirmar_senha"
                    class="mb-2 block text-sm font-semibold text-gray-600"
                >
                    Confirmar senha
                </label>

                <div class="relative">

                    <!-- ÍCONE CADEADO -->
                    <svg
                        class="absolute left-5 top-1/2 h-[22px] w-[22px] -translate-y-1/2"
                        width="25"
                        height="25"
                        viewBox="0 0 28 27"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M22.1666 9.477V7.875C22.1666 5.78642 21.3062 3.78338 19.7746 2.30653C18.2431 0.829685 16.1658 0 13.9999 0C11.834 0 9.75675 0.829685 8.2252 2.30653C6.69365 3.78338 5.83324 5.78642 5.83324 7.875V9.477C4.79416 9.91429 3.90975 10.6341 3.28815 11.5484C2.66656 12.4626 2.33473 13.5318 2.33324 14.625V21.375C2.33509 22.8663 2.95027 24.296 4.04383 25.3505C5.13739 26.405 6.62004 26.9982 8.16657 27H19.8332C21.3798 26.9982 22.8624 26.405 23.956 25.3505C25.0495 24.296 25.6647 22.8663 25.6666 21.375V14.625C25.6651 13.5318 25.3333 12.4626 24.7117 11.5484C24.0901 10.6341 23.2057 9.91429 22.1666 9.477ZM8.16657 7.875C8.16657 6.38316 8.78115 4.95242 9.87511 3.89752C10.9691 2.84263 12.4528 2.25 13.9999 2.25C15.547 2.25 17.0307 2.84263 18.1247 3.89752C19.2187 4.95242 19.8332 7.875 19.8332 7.875V9H8.16657V7.875ZM23.3332 21.375C23.3332 22.2701 22.9645 23.1286 22.3081 23.7615C21.6517 24.3944 20.7615 24.75 19.8332 24.75H8.16657C7.23831 24.75 6.34807 24.3944 5.6917 23.7615C5.03532 23.1286 4.66657 22.2701 4.66657 21.375V14.625C4.66657 13.7299 5.03532 12.8711 5.6917 12.2385C6.34807 11.6056 7.23831 11.25 8.16657 11.25H19.8332C20.7615 11.25 21.6517 11.6056 23.3332 21.375Z"
                            fill="#BBBBBB"
                        />
                        <path
                            d="M13.9999 15.7496C13.6905 15.7496 13.3938 15.8682 13.175 16.0791C12.9562 16.2901 12.8333 16.5763 12.8333 16.8746V19.1246C12.8333 19.423 12.9562 19.7091 13.175 19.9201C13.3938 20.1311 13.6905 20.2496 13.9999 20.2496C14.3093 20.2496 14.6061 20.1311 14.8249 19.9201C15.0437 19.7091 15.1666 19.423 15.1666 19.1246V16.8746C15.1666 16.5763 15.0437 16.2901 14.8249 16.0791 13.9999 15.7496Z"
                            fill="#BBBBBB"
                        />
                    </svg>

                    <input
                        id="confirmar_senha"
                        name="confirmar_senha"
                        type="password"
                        placeholder="••••••••••"
                        autocomplete="new-password"
                        required
                        class="h-11 w-full rounded-xl border border-[#9ee4f2]
                               bg-white pl-16 pr-5 text-sm text-gray-700
                               outline-none transition
                               focus:border-[#54bced]
                               focus:ring-2 focus:ring-[#54bced]/20"
                    >

                </div>

            </div>

        </div>


        <!-- BOTÃO -->
        <button
            type="submit"
            class="mx-auto mt-7 flex h-11 w-full max-w-[332px] items-center justify-center
                   rounded-xl bg-gradient-to-r from-[#4ba5ef] to-[#61d1c6]
                   text-sm font-bold text-white
                   transition hover:scale-[1.01]"
        >
            Criar conta
        </button>


        <!-- LOGIN -->
        <p class="mt-8 text-center text-xs text-gray-600">

            Já tem uma conta?

            <a
                href="{% url 'login' %}"
                class="font-bold text-[#419fca] hover:text-[#2995b0]"
            >
                Entrar
            </a>

        </p>

    </form>


    <!-- RODAPÉ -->
    <div
        class="mt-8 flex items-center justify-center gap-2
               text-xs text-gray-500"
    >

        <!-- ÍCONE CADEADO -->
        <svg
            class="h-[16px] w-[16px]"
            width="16"
            height="16"
            viewBox="0 0 28 27"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
                d="M22.1666 9.477V7.875C22.1666 5.78642 21.3062 3.78338 19.7746 2.30653C18.2431 0.829685 16.1658 0 13.9999 0C11.834 0 9.75675 0.829685 8.2252 2.30653C6.69365 3.78338 5.83324 5.78642 5.83324 7.875V9.477C4.79416 9.91429 3.90975 10.6341 3.28815 11.5484C2.66656 12.4626 2.33473 13.5318 2.33324 14.625V21.375C2.33509 22.8663 2.95027 24.296 4.04383 25.3505C5.13739 26.405 6.62004 26.9982 8.16657 27H19.8332C21.3798 26.9982 22.8624 26.405 23.956 25.3505C25.0495 24.296 25.6647 22.8663 25.6666 21.375V14.625C25.6651 13.5318 25.3333 12.4626 24.7117 11.5484C24.0901 10.6341 23.2057 9.91429 22.1666 9.477Z"
                fill="#BBBBBB"
            />
        </svg>

        <span>
            Área restrita a administradores
        </span>

    </div>

</div>

    </main>

</body>

</html>
