{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeurAI | Cadastrar administrador</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-blue-50 px-4 py-10 text-slate-700">
  <main class="w-full max-w-lg">
    <div class="mb-7 text-center"><img src="{% static 'images/logo-neurai.png' %}" alt="Logo NeurAI" class="mx-auto mb-4 h-14 w-14 rounded-2xl object-contain"><h1 class="text-2xl font-bold text-slate-800">Cadastrar Administrador</h1><p class="mt-2 text-sm text-slate-500">Crie um acesso seguro para a equipe NeurAI.</p></div>
    <section class="rounded-2xl bg-white p-8 shadow-md shadow-blue-100/70">
      <form method="post" class="grid gap-5 sm:grid-cols-2">
        {% csrf_token %}
        <label class="block sm:col-span-2"><span class="mb-2 block text-sm font-semibold">Nome completo</span><input type="text" name="nome" required placeholder="Ana Souza" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-cyan-400 focus:ring-4 focus:ring-cyan-100"></label>
        <label class="block sm:col-span-2"><span class="mb-2 block text-sm font-semibold">E-mail corporativo</span><input type="email" name="email" required placeholder="ana@neurai.com" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-cyan-400 focus:ring-4 focus:ring-cyan-100"></label>
        <label class="block"><span class="mb-2 block text-sm font-semibold">Senha</span><input type="password" name="senha" required placeholder="••••••••" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-cyan-400 focus:ring-4 focus:ring-cyan-100"></label>
        <label class="block"><span class="mb-2 block text-sm font-semibold">Confirmar senha</span><input type="password" name="confirmar_senha" required placeholder="••••••••" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-cyan-400 focus:ring-4 focus:ring-cyan-100"></label>
        <label class="block sm:col-span-2"><span class="mb-2 block text-sm font-semibold">Código de convite</span><input type="text" name="codigo" required placeholder="NEURAI-2026" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-cyan-400 focus:ring-4 focus:ring-cyan-100"></label>
        <button type="submit" class="sm:col-span-2 w-full rounded-xl bg-gradient-to-r from-blue-500 to-cyan-400 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-cyan-200 transition hover:-translate-y-0.5">Criar conta administrativa</button>
      </form>
      <p class="mt-6 text-center text-sm text-slate-500">Já possui acesso? <a href="/login/" class="font-bold text-blue-600 hover:text-cyan-600">Voltar ao login</a></p>
    </section>
  </main>
</body>
</html>
